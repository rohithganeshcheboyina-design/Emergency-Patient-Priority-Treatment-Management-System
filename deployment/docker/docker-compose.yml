version: '3.8'

services:
  # MySQL 8.0 Database Service with auto-provisioning
  mysql:
    image: mysql:8.0
    container_name: emergency-hospital-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_emergency_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically initialize schema and seed demo datasets on first boot
      - ../../database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../database/sample-data/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Visual Database Management Interface
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: emergency-hospital-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
